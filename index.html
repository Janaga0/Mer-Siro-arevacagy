<script>
const book=[
{t:"ԳԼՈՒԽ 1",s:`Ժասմինը սովորում է տասներկուերորդ դասարանում։ Նա սիրում է սպորտը․ վազում է, թենիս խաղում։ Եթե Ժասմինը դասի չէր, ապա թենիսի սենյակում էր։ Նա սկզբում լավ խաղալ չգիտեր, բայց ժամանակի ընթացքում, Գոռի հետ խաղալով, սովորեց և դարձավ լավագույններից մեկը։
Գոռը նույն դպրոցից էր, սովորում էր տասնմեկերորդ դասարանում և երաժիշտ էր։ Նա նույնպես թենիսի լավագույն խաղացողներից էր։
Նոյեմբերի 4-ին նրանք մասնակցում էին վազքի մրցույթի, որի հեռավորությունը չորս կիլոմետր էր։ Նրանք միմյանց համար սովորական մարդիկ էին, բայց նոյեմբերի 4-ը կարծես փոխեց ամեն ինչ։ Մրցույթը, որը կայանալու էր Էջմիածնի Սուրբ Մայր Աթոռ տանող ճանապարհին, նրանց մտերմացրեց։
Գոռ — Գոհա՛ր, վազի՛ր, վազի՛ր։
Ժասմին — Ի՞նձ ես ասում։
Գոռ — Ալվա՛րդ, վազի՛ր։
Ժասմինը զարմացած նայեց շուրջը։ Նրանք շատ լավ էին վազում։ Ճիշտ է՝ հաղթանակ չտարան, բայց կարծես Աստված հենց այդպես էր ծրագրել։ Նրանք շնչակտուր հասան վերջնակետին՝ երեքով՝ Ժասմինը, Գոռը և Լյովը՝ Ժասմինի մտերիմ ընկերը։
Վերջնակետում նրանք կարմրած ու մի փոքր վատ վիճակում էին։ Դե, չորս կիլոմետր վազելն այդքան էլ հեշտ չէ։
Գոռ — Արի՛ գնանք ջուր վերցնենք։
Ժասմինը ոչինչ չասաց, պարզապես գնաց Գոռի հետ։ Երբ նա ուզում էր ջուր վերցնել, Գոռն ասաց.
Գոռ — Մեզ երկու շիշ ջուր։
Նա վերցրեց ջրերը և մեկը տվեց Ժասմինին։ Ժասմինը գնահատեց Գոռի բարեկիրթ քայլը։
Ժասմին — Շնորհակալություն, — ասաց ժպիտով։
Նրանք քայլեցին դեպի մյուսները։ Այնտեղ էր նաև այն աղջիկը, որը հավանում էր Գոռին։ Ամեն ինչ ավարտելուց հետո նրանք գնացին ավտոբուսը։
Բոլորը քաղցած էին, և ավտոբուսը կանգնեց մի խանութի դիմաց։ Բոլորը մտան խանութ։ Ժասմինը կանգնած էր իր ընկերուհու՝ Անիի հետ, երբ Գոռը մոտեցավ նրան։
Գոռ — Ի՞նչ կխմես։
Ժասմինը՝ զարմացած ու կտրուկ — Ոչինչ։
Ժասմինը պարզապես հեռացավ։ Գնումներն ավարտելուց հետո նրանք վերադարձան տուն։
Երկուշաբթի՝ արդեն դպրոցում։
Գոռ — Բերե՞լ ես։ — Խոսքը շապիկների մասին էր, որոնք պետք է հագնեին հավաստագրերը ստանալու համար։
Ժասմին — Ինչի՞ համար։ Այսօր չենք ստանալու։
Այդ օրը մի դեպք էր պատահել, և միջոցառումը հետաձգվել էր։
Նոյեմբերի 22
Բոլորը խուճապահար վազվզում էին, որպեսզի հագնեն իրենց շապիկները։
Գոռ — Փոխվի՛ր, Ժասմի՛ն։
Ժասմինը փոխվեց և եկավ։ Երբ ուզում էր կանգնել շարքում, նկատեց, որ Գոռը ժպիտով իրեն է նայում։
Ժասմինն իր մտերիմ ընկերուհուն պատմել էր, որ Գոռն իրեն տարօրինակ է պահում։
Հավաստագրերը ստանալուց հետո նրանք բարձրացան դասարան։ Ժասմինը դուրս եկավ դասարանից։ Գոռն իր ընկերների հետ նույնպես դուրս էր գալիս։ Տեսնելով Ժասմինին՝ ասաց.
Գոռ — Շնորհավոր, բռա՛տս։
Ժասմինը մի պահ զարմանքից քարացավ։ Երբ ուշքի եկավ, Գոռն այդքան էլ չէր հեռացել։
Ժասմին — Քոնն էլ, — բարձրաձայն ասաց։
Ժասմինը գնաց պատուհանի մոտ կանգնած Անիի և Լյուսիի մոտ։ Լյուսին ամեն ինչից տեղյակ էր, իսկ Անին՝ ոչ, բայց կարծես նա էլ էր ինչ-որ բան նկատում։
Լյուսին և Ժասմինը սպասում էին Ժասմինի ծննդյան օրվան, քանի որ ամենահետաքրքիրը հենց այդ օրը պետք է լիներ։`},
{t:"ԳԼՈՒԽ 2",s:`Վերջապես եկավ այդքան սպասված օրը։
Դասարանի աղջիկները որոշել էին այդ օրը տարբերվող հագնվել և գեղեցիկ նկարներ անել։ Անին եկավ ու կանչեց Ժասմինին, որպեսզի վերջինս օգնի իրեն գրել ֆիզիկայի թեմատիկ գրավոր աշխատանքը։ Այդ ժամանակ, երբ Ժասմինը գրում էր խնդիրների լուծումները, Գոռը դուրս եկավ իրենց դասարանից։ Ի դեպ, Գոռն ու Լունան նույն դասարանում էին սովորում։
Գոռ — Ի՞նչ առիթ է, որ այսպես սիրունացել եք։
Անի — Ծնունդն է, — բացականչեց նա։
Գոռ — Հա՜, շնորհավոր, — ժպտաց։
Ժասմին — Շնորհակալություն, — նույնպես ժպտաց։
Գոռը դուրս գնաց, իսկ Ժասմինը վերադարձավ դասարան։
Դասամիջոցին Ժասմինը երկու դասընկերուհիների հետ գնացել էր խանութ։ Վերադառնալիս աստիճանների մոտ տեսավ Գոռին։
Գոռը սկսեց երգել.
— Քո ծնունդն էսօր ա, էս ի՜նչ հավես օր ա։
Տեսնելով Ժասմինի հետ բարձրացող աղջիկներին՝ Գոռը միանգամից դադարեց երգել։ Ժասմինը ժպտաց և աղջիկների հետ բարձրացավ դասարան։
Կարծես Գոռն ամեն ինչ անում էր, որ Ժասմինը ժպտա։ Մի քանի օր այդպես հետաքրքիր անցավ։ Նրանք գնալով մտերմանում էին։
Մի օր Ժասմինը և իր դասընկերները որոշեցին, որ կարելի է տնօրենի հետ խոսել և դպրոցի դահլիճում Ամանորին ընդառաջ խնջույք կազմակերպել։ Նրանք արդեն դուրս էին գալիս։
Դասղեկ — Եկե՛ք զգուշացնենք տնօրենին։ Եթե ազատ է, գնանք։
Նրանք զանգահարեցին, բայց տնօրենը զբաղված էր, և չգնացին։ Ժասմինը դեռ կանգնած էր դռան մոտ։ Հետ-հետ քայլելով՝ դուրս եկավ միջանցք՝ չնկատելով, որ Գոռը կանգնած է իր հետևում։ Նա կանգնեց Գոռի ոտքին և միանգամից շրջվեց։
Ժասմին — Ո՞ւմ ես ուզում — շփոթված հարցրեց Գոռին։
Գոռը կանչեց դասարանի տղաներից մեկին և ինչ-որ բան ասաց։ Ժասմինը տեսավ, որ կարևոր ոչինչ չկա, և հեռացավ։
Մի քանի օր անց։
Ժասմինն ու Լյուսին դուրս էին գալիս, իսկ նրանց դիմացով քայլում էր Գոռն իր ընկերոջ հետ։ Գոռը շրջվեց և ինչ-որ մեկին ինչ-որ բան ասաց։
Լյուսին, օգտվելով առիթից, ասաց.
Լյուսի — Էդ մե՞զ էիր ասում։
Գոռ — Չէ։
Լյուսի — Հա՛, էս էլ մտածեցի՝ Ժասմինի հետ ես խոսում։
Գոռ — Չէ՛։ Ժասմինին ո՞վ կարա բան ասի․ դանակը կհանի, սաղին կսպանի։
Ժասմինը միշտ իր մոտ դանակ էր պահում, բայց ոչ մարդկանց վնասելու համար։
Լյուսի — Չէ՛, էս վերջերս բարիացել է։
Գոռ — Հա՞, Ժասմինս բարիացել ա։
Լյուսին զարմացավ, իսկ Ժասմինը չէր լսել, թե ինչ ասաց Գոռը։
Գոռ — Ժա՛ս, դու մեր հետ ես չէ՞ ծառայելու։
Ժասմին — Ես հեռու եմ գնալու։ Ինչքան հեռու, էդքան լավ։ Գնալու եմ Սիսիան։
Գոռ — Քեզ պե՞տք ա էս ձյունուբուքի մեջ։
Ժասմին — Ծառայությունն էդ ձյունուբուքի մեջ ա։
Եվ նրանք գնացին դուրս։
Մի քանի օր անց՝ խնջույքի օրը։
Առավոտյան բոլորը պատրաստվում էին։ Դե, իհարկե, մյուս դասարանները դասի էին։ Տասնմեկերորդ դասարանի ֆիզկուլտուրայի ժամը առաջ էին բերել։ Իսկ Ժասմինը միշտ նրանց հետ ֆիզկուլտուրա, ֆիզիկա և մաթեմատիկա էր անում։ Տասնմեկերորդ դասարանի տղաներից մեկը, որը նաև իր թաղից էր, առաջարկեց Ժասմինին միանալ իրենց։ Նա էլ չմերժեց։ Երբ այդ տղան մտավ դահլիճ, ասաց.
— Գուշակե՛ք՝ ում եմ բերել։
Բոլորը նայեցին դռանը, և երբ Ժասմինը ներս մտավ, Գոռը նայեց նրան, ու նրա դեմքին գեղեցիկ ժպիտ հայտնվեց։
Մի քանի խաղերի ժամանակ, երբ Ժասմինը գնում էր այնտեղ խաղալու, ինքն ու Գոռը կանգնում էին միմյանց դիմաց և միշտ կատակով վիճում։
Այդ օրը, երբ դասերն ավարտվեցին, սկսվեց խնջույքը։ Ժասմինը տխրեց, քանի որ սկսվում էին ձմեռային արձակուրդները։ Բայց կարծես նրան տխրեցնում էր նաև Գոռին երկու շաբաթ չտեսնելու միտքը։ Բոլորը ուրախանում էին, պարում ու երգում, իսկ Ժասմինը նստած նայում էր նրանց՝ միևնույն ժամանակ փորձելով ցույց չտալ, որ տխուր է։
Այսպես ավարտվեց տարին, եկավ Նոր տարին՝ նոր հետաքրքրություններով։`},
{t:"ԳԼՈՒԽ 3",s:`ԱՄԱՆՈՐԻՑ ՀԵՏՈ
Ամանորին Ժասմինը և նրա քույրը՝ Ալվինան, գնում էին խանութ, երբ ճանապարհին տեսան Գոռին։
Ալվինա — Օ՜, ո՞վ էր, այս սիմպո՛ն։
Ժասմին — Ուզողս, — ծիծաղելով պատասխանեց։
Գոռն անցավ նրանց կողքով, ապա շրջվեց և նայեց նրանց հետևից։ Ժասմինը նույնպես շրջվեց․ նրանց հայացքները հանդիպեցին։ Ժասմինն ու Ալվինան շարունակեցին ճանապարհը դեպի խանութ։
Մի քանի օր անց դպրոցը վերաբացվեց, և դրա հետ մեկտեղ դպրոցում բացվեց թենիսի սենյակը։ Այն կարծես դարձավ Ժասմինի դասարանը․ նա այնտեղ ավելի շատ էր լինում, քան դասարանում։
Ժասմինը սկզբում խաղալ չգիտեր, իսկ Լյուսին շատ լավ էր խաղում, բայց Ժասմինի հետ չէր գնում խաղալու։ Ժասմինն ու Լյուսին պետք է մասնակցեին մրցույթի, և Ժասմինը սկսեց սովորել խաղալ, քանի որ աղջիկներից միայն Լյուսին էր խաղալ կարողանում։ Ժասմինը տղաների հետ էր խաղում։ Նա սկսեց շատ լավ խաղալ։ Քանի որ ֆիզկուլտուրայի ուսուցչի հետ մտերիմ էր, բանալիները վերցնում ու գնում էր թենիսի սենյակ։
Սկզբում դասարանից մի քանի հոգու հետ էր գնում, իսկ հետո՝ արդեն Գոռի։ Մի քանի անգամ նրանք նույնիսկ մենակ են մնացել։ Բայց հետաքրքիր խոսակցություններ լինում էին հատկապես այն ժամանակ, երբ Լյուսին էլ էր նրանց հետ։
Մի անգամ նրանք երեքով էին, և խոսակցություն բացվեց։
Գոռը Լյուսիին ասաց.
— Դու գյուղո՞ւմ ես ամուսնանալու։
Լյուսի — Չէ՛, ես քաղաք եմ գնալու։
Գոռ — Քաղաքում ի՞նչ կա որ։ Ես գյուղն եմ սիրում։
Ժասմին — Հա՛, ես էլ եմ գյուղը սիրում։
Լյուսի — Դու ընկերուհի ունե՞ս։
Գոռ — Չէ՛, հլը ժամանակը չի։
Լյուսի — Չէ՛, ինչի՞, արդեն պետք ա ունենաս։
Լռություն տիրեց։
Գոռ — Ես գիտեմ՝ դու ում հետ ես շփվում։
Ժասմին — Ե՞ս։ Ու՞մ։ Ես ոչ մեկի հետ չեմ շփվում։
Լյուսի — Ժասմի՛նը ո՞ւմ հետ։ Եթե տենց բան լիներ, ես կիմանայի։
Լյուսի — Էն խեղճ տղեն ուզում էր, չուզեցիր։ Ասենք՝ ի՞նչ վատ տղա էր։
Խոսքը մի տղայի մասին էր, ով մեկ տարի առաջ հավանում էր Ժասմինին։ Բայց Ժասմինը չէր սիրում այդ տղային։ Գոռն էլ էր տեսել, թե ինչպես էին այդ տղան ու Ժասմինը կանգնած իրար հետ։ Նա գիտեր, որ տղան պատրաստվում է խոստովանել, և նույնիսկ ասել էր տղային.
Գոռ — Լա՛վ մտածիր՝ ինչ ես անում։
Ժասմին — Լավ էլի՛, ո՞վ էր դա ընդհանրապես։ Ավելի լավ էր՝ ինձ չխոստովաներ։
Լյուսի — Ինչի՞, ի՞նչ վատ տղա էր։
Ժասմին — Լավ էլի՛, լավ, — Ժասմինը, նայելով Գոռին, ասաց։ — Դու ասա՛, դու էլ տեսար, չէ՞։
Գոռ — Լավ, չէ՛, լուրջ։ Ես գիտեմ՝ դու ում հետ ես շփվում։
Ժասմին — Ես ոչ մեկի հետ չեմ շփվում։
Գոռ — Արի՛, գրազ գանք։
Ժասմին — «Շփվել» ասելով՝ ի՞նչ նկատի ունես։
Գոռ — Ընկեր-ընկերուհի։
Ժասմին — Արի՛, ես վստահ եմ, որ դու սխալվում ես։
Նրանք ձեռք սեղմեցին, իսկ Լյուսին միջամտեց՝ ասելով.
Լյուսի — Ֆսյո՛։
Ժասմին — Աղջկա հետ գրազ չեն գալիս, — ժպիտով Գոռին փրկեց։
Գոռ — Էն տղեն, որ դպրոցի մոտ տեսա, ախպե՞րդ էր։
Ժասմին — Չէ՛, քեռիս էր, — ծիծաղեց։
Գոռ — Լո՞ւրջ։ Քեզնից ջահել էր։
Ժասմին — Բա 29 տարեկան ա, ի՞նչ ես ուզում։
Լյուսի — Լավ, ես գնամ, ձեզ մենակ թողնեմ։
Ժասմինն ու Գոռը լռեցին, բայց Գոռի դեմքի արտահայտությունը փոխվեց։
Նրանք շարունակեցին խաղալ։ Երբ Ժասմինը հաղթեց, զարմացավ։
Ժասմին — Ո՞նց քեզ հաղթեցի։ Ուրեմն ինձ հետ մի բան այն չէ․ ես չէի կարող քեզ հաղթել։
Գոռը պարզապես ժպտաց, իսկ Ժասմինը զարմացել էր, որովհետև Գոռի ներկայությունից միշտ շփոթվում էր։
Ժասմին — Հիշո՞ւմ ես, որ մի անգամ ասեցիր՝ հետաքրքրվել ես և գիտես, որ ես ուզող ունեմ։
Գոռ — Ե՞րբ։ Չեմ հիշում։
Ժասմինը փորձում էր հիշեցնել, իսկ Գոռը ձևացնում էր, թե չի հիշում։ Բայց Ժասմինը շատ լավ գիտեր, որ Գոռն իր մասին էր խոսում։
Դա այն դեպքն էր, երբ Ժասմինը միջանցքում կանգնած՝ դպրոցի տղաներից մեկի գրած բանաստեղծություններն էր կարդում։ Անին ու Գոռը դուրս եկան իրենց դասարանից, որպեսզի պլակատներն ամրացնեն։ Նրանք միջանցքում կանգնած էին, երբ Անին կանչեց Ժասմինին։
Անի — Ժա՛ս, հլը արի՛։
Ժասմինը մոտեցավ։
Անի — Գոռն ասում ա՝ գիտի, թե ով ա քեզնով հետաքրքրվում։
Գոռ — Հա՛, հետաքրքրվել եմ։ Ո՞վ ա քեզ հավանում։
Ժասմին — Ո՞վ, — հարցրեց՝ սպասելով պատասխանին։
Գոռ — Չեմ ասի։
Ժասմին — Լավ, լո՛ւրջ, ո՞վ ա, — ասաց՝ հասկանալով, որ Գոռն իր մասին է խոսում։
Գոռ — Մեր դասարանի Մամիկոնը։
Ժասմին — Լո՞ւրջ ես խոսում։
Գոռ — Չէ՛, կատակ եմ անում։
Ժասմինը ձեռքով խփեց Գոռին և չհասցրեց նրանից խոստովանություն կորզել։ Այդ պահին Լյուսին եկավ ու ասաց, որ ուսուցիչը կանչում է։ Ժասմինը գնաց։
Նրանք շարունակեցին խաղալ, և այս անգամ հաղթեց Գոռը։ Հետաքրքիրն այն էր, որ երբ Գոռն էր հաղթում, Ժասմինն էր ուրախանում, իսկ երբ Ժասմինն էր հաղթում՝ Գոռը։ Իսկ ի՞նչ էր սա նշանակում։`},
{t:"ԳԼՈՒԽ 4",s:`Անին բիզնես ներկայացում էր բեմադրել և տոմսեր վաճառել։ Քանի որ նրանք տասնմեկերորդ դասարանում էին, այդպիսի առարկա ունեին։ Անին Ժասմինին առաջարկեց մասնակցել, քանի որ չէր գտնում դերակատարի։ Ժասմինը չմերժեց Անիին։
Փորձերից մեկի ժամանակ Գոռը վերցրեց Ժասմինի ականջակալները, որպեսզի երգ լսի։ Արդեն տասը րոպե էր, ինչ ականջակալները Գոռի մոտ էին։
Գոռ — Մի հատ քո ճաշակով երգ դիր։
Ժասմինը տարբեր երգեր միացրեց։ Հետո հեռախոսը տվեց Գոռին և ասաց, որ իր ցանկությամբ լսի՝ ինչ ուզում է։
Երբ զանգին տասը րոպե էր մնացել, Գոռը դուրս եկավ դահլիճից՝ իր հետ տանելով Ժասմինի ակնոցները, իհարկե՝ նրա թույլտվությամբ։ Մյուս դասամիջոցին Գոռը վերադարձրեց դրանք։
Ներկայացումից մի քանի օր առաջ Լյուսին Ժասմինին ասաց, որ Գոռը ընկերուհի ունի։
Ժասմինը մտածեց.
— Իսկ ինչո՞ւ է նման կերպ իրեն պահում, ասես սիրահարված է։
Ժասմինի տրամադրությունն ընկավ, բայց նա շարունակեց իրեն պահել այնպես, ինչպես սովորաբար էր։ Հետո նա ինքն իրեն ասաց.
Ժասմին — այսօր ընկերուհի ունի, վաղը չի ունենա։
Ներկայացման օրը Ժասմինն ու Լյուսին վերջնական փորձի ժամանակ նստել էին դահլիճի վերջին շարքում, մինչ բոլորը պատրաստվում էին։ Ժասմինը ինչ-որ պատմություն էր կարդում, իսկ Լյուսին հեռախոսով էր զբաղված։ Տղաներից մեկը վերցրել էր Ժասմինի դանակը, և Գոռը գալիս էր այն վերադարձնելու։
Վերջին շարքի անկյունում նստած՝ Ժասմինը հասավ պատմության հետաքրքիր հատվածին և բարձր արձագանքեց։ Այդ պահին Գոռը դանակը բերեց։ Ժասմինը ձեռքը մեկնեց՝ այն վերցնելու, բայց Գոռը ամուր պահել էր դանակը։ Ժասմինը սառը հայացքն ուղղեց Գոռին։ Նա ժպտաց, բաց թողեց դանակը և գնաց։
Լյուսի — Թե ասա տղա ջան, ընկերուհի ունես, ինչի՞ ես քեզ էսպես պահում:
Ժասմինը ուղղակի լռեց։
Ներկայացմանը քիչ էր մնացել, ուր որ է՝ պետք է սկսվեր։ Գոռը վերնաշապիկն էր հագնում և փորձում էր ուղղել այն։ Հանկարծ Ժասմինը նկատեց, որ վերնաշապիկը լավ չի նստում, և կանչեց Գոռին։
Ժասմին — Լրջանում ենք ու նորմալ ներկայանում։
Ներկայացումը շատ լավ անցավ, իսկ հետո այն իսկական հիթ դարձավ։`},
{t:"ԳԼՈՒԽ 5",s:`Մայիսի 10
Այս օրը Ժասմինի սիրելի օրերից մեկն էր։
Այդ օրը Շամիրամ գյուղում պետք է տեղի ունենար վազքի մրցույթ։ Դպրոցից պետք է մասնակցեին յոթ աղջիկ և հինգ տղա։ Դե, Ժասմինը, իհարկե, բաց չէր թողնի նման առիթը, բացի այդ՝ վազքը միշտ նրան գրավել էր։ Նրա հետ կար նաև մի աղջիկ՝ Վիկան, որը Ժասմինի մտերիմներից էր։ Տղաների շարքում էին նաև Լևոնը և Գոռը։
Նրանք պետք է վազեին իններորդ խմբի հետ և բավական ժամանակ ունեին պատրաստվելու համար։ Ժասմինը լավ գիտեր, թե ինչ էր սպասվում, և իր հետ ջուր էր վերցրել։
Լյովն ու Դանին ուզում էին լվացվել։ Մեքենան մի փոքր հեռու էր, իսկ Լյուսին ու Ժասմինը նույնպես ցանկացան նրանց հետ գնալ՝ ջուր խմելու։
Երբ արդեն հետ էին գալիս, խմբերից մեկից ինչ-որ մեկը հարցրեց.
Ինչ-որ մեկը — Դուք ո՞ր խմբից եք։
Դանի — Իններորդ։
Ինչ-որ մեկը — Դե ասա՝ քնեցիք էստեղ, — ծիծաղեց։
Դանի — Հլը հանգստացի՛ր, — կոպտեց։
Լյով — Լավ։
Ինչ-որ մեկը — Ի՞նչ ասեցիր։
Ժասմին — Ինչ որ լսեցիր, — կոպտորեն պատասխանեց։
Երբ տղաները գնացել էին ծխելու, վերադառնալիս Լյովը երկու ծաղիկ բերեց՝ մեկը Վիկային, մյուսը՝ Ժասմինին։ Նրանք ժպտացին և շնորհակալություն հայտնեցին։ Կարծես Ժասմինի կոշիկի շնորն արձակվել էր։ Նա ծաղիկը տվեց Վիկային և նստեց՝ շնորները կապելու։
Գոռ — Էդ ո՞վ ա տվել։
Վիկա — Լյովը։
Ժասմինը կանգնեց և Վիկայից վերցրեց իր ծաղիկը։ Գոռը զարմացավ և խանդոտ հայացքով նայեց Ժասմինին։
Գոռ — Լավ։
Ժասմինը ժպտաց։
Նրանք սպասում էին իրենց հերթին։ Երբ արդեն կանգնել էին շարքով, Ժասմինը տղաներից մեկի հետ կանգնած էր վերջում, և Գոռը եկավ ու կանգնեց նրա կողքին։
Ժասմին — Երեխե՛ք, չենք լարվում, նորմալ վազում ենք։ Լա՞վ ։
Քանի որ Ժասմինը ավագն էր, փորձում էր ոգևորել մյուսներին։
Մարզիչ — Մե՛կ, երկո՛ւ, երե՛ք, գնացի՛նք։
Բոլորը վազեցին։ Առջևում դեռ երեք կիլոմետր կար։ Ժասմինը հիմնականում Գոռի կողքին էր, քանի որ տեսնում էր, որ նա իրեն լավ չի զգում։
Ժասմին — Ո՞ղջ ես։
Գոռ — Չէ՛, էս ա մեռնում եմ։ Մնամ ստեղ։
Ժասմին — Ես հետդ եմ, քեզ կտանեմ, — ժպտաց։
Նրանք հասան մի տեղ, և Ժասմինը կարծեց, թե վերջնակետն է, ու կանգնեց։ Բայց հետո հասկացավ, որ դա դեռ վերջը չէ։ Շրջվեց և տեսավ, որ Գոռն իրեն վատ է զգում ու կանգնել է։ Չմտածելով հաղթանակի մասին՝ Ժասմինը հետ գնաց Գոռի մոտ։
Ժասմին — Լա՞վ ես։
Գոռը լռեց։
Մարզիչ — Գնա՛, նստի՛ր շտապօգնության մեքենան։
Գոռ — Չէ՛, — կտրուկ ու ջղայն տոնով պատասխանեց, ապա շարունակեց վազել։
Ժասմինը շատ լավ վազելով հասավ վերջնակետին։ Բոլորը զարմացած էին, բայց նրա միտքը Գոռի մոտ էր։ Մոտենալով Վիկային՝ հարցրեց.
Ժասմին — Գոռն ո՞ւր ա։
Վիկա — Էնտեղ ա, — ցույց տվեց Գոռի ուղղությամբ։
Գոռը կարծես շատ վատ վիճակում նստած էր։ Ժասմինը գնաց նրա մոտ։
Ժասմին — Ո՞նց ես։
Գոռը կարմրած դեմքով ու աչքերով նայեց Ժասմինին։ Ժասմինը մնաց նրա կողքին, բայց մի փոքր ուշքի գալուց հետո Գոռն անհետացավ։
Քիչ անց բոլորը հավաքվեցին, որպեսզի գնան։
Ժասմինը աչքը չէր կտրում Գոռից։ Երբ արդեն հասան գյուղ և կանգնեցին դպրոցի մոտ, Գոռը հարցրեց.
Գոռ — Երկուշաբթի ո՞վ է գալիս Վազգեն Սարգսյան։
Ժասմին — Ես։
Գոռ — Դզե՛ց։
Ժասմինը ժպտաց և իջավ մեքենայից։ Դասերն ավարտվել էին, և Անին դպրոցի բակում էր։ Նրանք միասին գնացին տուն։
Մի քանի օրից կրկին միջոցառում կար և որոշեցին, որ Ժասմինը պետք է մասնակցի։
Երեքշաբթի օրվանից սկսեցին պատրաստվել Անիի ներկայացմանը։ Այդ ներկայացման համար կիթառ էր պետք, և Ժասմինը իր կիթառը տվել էր Գոռին։
Գոռը նաև իր դհոլն էր բերել։ Լյուսին նստած էր բեմին, իսկ Գոռը նրան դհոլ նվագել էր սովորեցնում։ Ժասմինն էլ ցանկացավ սովորել։ Երբ Գոռը բռնեց նրա ձեռքից, որպեսզի ցույց տա, Ժասմինի ներսում կարծես ամեն ինչ խառնվեց։ Լարվածությունից նա չկարողացավ ցույց տալ, թե ինչ է կարողանում է անել, բայց Գոռն օգնեց նրան։ Երբ Ժասմինը տեսավ, որ Գոռը գոհ է, ժպտաց։
Ներկայացման ավարտից հետո Ժասմինը փնտրում էր իր կիթառի պատյանը։ Գոռը նրան ուղեկցեց դեպի փակ կուլիսները, որտեղ դրված էր կիթառի պատյանը։ Միքոն տվեց պատյանը, և նրանք դուրս եկան։ Այդ պահին տղաներից մեկը ձայն տվեց Գոռին։
Ժասմինը մտածեց.
— Հիմա այդ տղան ի՞նչ կմտածի։
Նրանք գրեթե ամեն ինչ ավարտել էին, երբ Գոռը ձայն տվեց Ժասմինին։
Ժասմին — Ջա՛ն։
Գոռը շփոթվեց և ինչ-որ բան հարցրեց։
Ավարտելուց հետո նրանք սեղաններն էին բարձրացնում դասարան։ Վերադառնալիս տեսան այն աղջկան, որը հավանում էր Գոռին։
Ժասմին — Սերդ քեզ ա սպասում։
Գոռ — Սա ինձ ի՞նչ սեր։
Ժասմինը պարզապես ժպտաց և գնաց դահլիճ։
Բոլորն արդեն դուրս էին գալիս դպրոցից։ Գոռը կարծես դանդաղեցնում էր քայլերը, որպեսզի Ժասմինի ու Անիի հետ քայլի։ Գոռը վառեց ծխախոտը, իսկ Ժասմինը չէր սիրում այդ ծուխը։
Ժասմին — Էն կողմ տար էլի։
Գոռ — Ինչի՞, ալերգիա ունե՞ս։
Ժասմին — Չէ՛, ուղղակի խեղդվում եմ էդ հոտից։
Գոռը ծխախոտը մի կողմ տարավ։
Նրանք գնացին տուն, բայց Ժասմինը դեռ պետք է դպրոց գար, քանի որ իրենց մոտ սկսվել էին «Վերջին զանգի» փորձերը։
Դե, բայց ասեք՝ երեկոյան դպրոցում ինչ հավես է։ Ամենալավն այն էր, որ Գոռը երեկոյան ժամերին դպրոցի բակում էր լինում։ Ժասմինը բաց չէր թողնում այդ առիթը և ջուր խմելու պատրվակով դուրս էր գալիս։ Մոտենում էր «Վերջին զանգը», և կարծես ամեն ինչ ավելի արագ էր զարգանում։ Չորս օր էր մնացել «Վերջին զանգին»։
Մայիսի 20
«Վերջին դասի» օրն էր։ Ժասմինը, իր տոնական հագուստով, որոշեց գնալ թենիս խաղալու։
Նա գնաց, վերցրեց մարզասենյակի բանալիները։ Քանի որ Ժասմինի հետ մարդ չկար, նա առաջարկեց Գոռին միանալ իրեն։ Դե, Գոռն առիթը բաց չէր թողնի, թեև նրանք մենակ չէին, տղաներից մեկն էլ էր նրանց հետ։
Ժասմինը խաղում էր այդ տղայի հետ, իսկ Գոռը կանգնած էր ու պարզապես հետևում էր։ Երբ գնդակն ընկավ, Ժասմինը ոտքով հրեց այն, սայթաքեց ու ընկավ։ Գոռը շտապեց օգնել։
Ժասմին — Ես ինքս։
Բայց Գոռը, միևնույն է, օգնեց։ Էստեղ են ասել՝ աղջի՛կ ջան, ինչո՞ւ ես քեզ թանկացնում։
Քիչ-քիչ տղաները շատացան, և Ժասմինը որոշեց գնալ։ Ռակետները թողնելով այնտեղ՝ տղաներից մեկին ասաց, որ խաղն ավարտելուց հետո վերադարձնի դրանք։ Այդ տղան Ժասմինի մանկության ընկերներից էր։
Ժասմինը միջանցքում տեսավ Գոռին ու հարցրեց.
Ժասմին — Գո՛ռ։
Գոռ — Հա՛։
Ժասմին — Էնտեղ դեռ խաղո՞ւմ են։
Գոռ — Հա՛։
Ժասմին — Լավ։
Այսօրն էլ այսպես ավարտվեց։
Երկու օր էր մնացել «Վերջին զանգին»։ Ժասմինն ու Գոռը նորից թենիս էին խաղում։ Լյուսին մի պահ եկավ, ապա գնաց։ Լյուսիի դուրս գալուց հետո Գոռն ասաց.
Գոռ — Շատ կկարոտեմ ձեզ, ձեր դասարանից՝ քեզ ու Լյուսիին։
Հաջորդ օրը՝ «Վերջին զանգի» նախորդ օրը, Ժասմինն ու Լյուսին նստած էին դպրոցի բակում։ Գոռը տուն էր գնում իր ընկերների հետ։
Ժասմին — Վաղը գալու եք, չէ՞, «Վերջին զանգին»։
Գոռ — Անպայման։
Ժասմին — Դե, կսպասենք։
Հաջորդ օրը Ժասմինը վաղ առավոտյան եկել էր դպրոց, որպեսզի վայելի իր վերջին օրը դպրոցում։ Եվ չգիտես ինչու՝ Գոռը, Լյովը և մի քանի տղաներ նույնպես եկել էին։
Ժասմինը Լյովի հետ կանգնած խոսում էր միջանցքում, իսկ Գոռը անընդհատ դուրս էր գալիս դասարանից ու նորից վերադառնում։ Հետո ուսուցիչներից մեկը եկավ և բոլորին ուղարկեց տուն՝ մինչև «Վերջին զանգի» սկսվելը։
Ժասմինը մնաց դպրոցում։ Երբ «Վերջին զանգին» մեկ ժամ էր մնացել, Ժասմինը զանգեց Գոռին և կանչեց ներս։ Գոռը եկավ, Ժասմինը տոմս տվեց նրան, և նա գնաց ներս։
«Վերջին զանգից» հետո, երբ բոլորը դրսում կանգնած էին, Գոռը մոտեցավ։
Գոռ — Շնորհավոր, — ժպտալով ասաց բոլորին, բայց նայեց Ժասմինին։
Ժասմին — Մերսի, — ժպտալով պատասխանեց։`},
{t:"ԳԼՈՒԽ 6",s:`Անցավ մի քանի օր։ Գոռն Instagram-ի իր սթորի բաժնում մի նկար տեղադրեց և չանցած մեկ րոպե՝ ջնջեց։ Կարծես Գոռը ձեռքն էր վնասել։
Ժասմին — Հասցրել եմ տեսնել։ Ի՞նչ է պատահել ձեռքիդ։
Գոռ — Նորմալ է, կանցնի։
Ժասմին — Հա՛, բայց ի՞նչ է պատահել։
Գոռ — Կոճն ա կոտրվել։
Ժասմին — Ու կոտրված կոճին ուղղակի բինտ է փաթաթվա՞ծ։
Եվ նրանք սկսեցին երկար խոսել։ Հետո Ժասմինն ասաց.
Ժասմին — Լավ դե, արդեն ուշ է, ես գնամ քնելու։
Գոռ — Բարի գիշեր, քեզ լավ օր։
Ժասմին — Ապրես։
Մի քանի օր անց։
Հունիսի 26-ին Ժասմինը դասընկերների հետ գնացել էր էքսկուրսիա։ Երեկոյան Գոռը գրեց նրան։ Նրանք սկսեցին խոսել, և Գոռը խոսք բացեց՝ իբրև ընկերուհի է փնտրում, բայց իրականում նրան Ժասմինն էր հետաքրքրում։
Գոռ — Դու ընկեր ունե՞ս։
Ժասմին — Չէ՛, ինչի՞։
Գոռ — Իսկ կուզե՞ս ունենալ։
Ժասմին — Չեմ հասկանում՝ ինչ է կատարվում։ Կարո՞ղ եմ չպատասխանել։
Գոռը չէր հանձնվում։ Նա արդեն սկսել էր խոսակցությունը և պետք է ավարտին հասցներ։ Ժասմինը հասկանում էր, որ Գոռն իր մասին է խոսում։
Ժասմին — Գո՛ռ, դու իմ ընկերն ես։ Չգիտեմ՝ դու ինչ ես մտածում, ինչ ես զգում։
Գոռ — Ճիշտն եմ զգում։
Ժասմինը հասկանում էր, թե ուր էր գնում խոսակցությունը, և ուզում էր բառ առ բառ լսել ամեն ինչ։
Ժասմին — Ու՞։
Գոռ — Ուզո՞ւմ ես իմանալ։
Ժասմին — Հա՛։
Գոռ — Բայց վախենում եմ ասեմ։
Ժասմին — Մի՛ վախեցիր։
Գոռ — Լավ, էսքան ժամանակ, ինչ շփվել ենք, անտարբեր չեմ եղել քո հանդեպ։ Ուզում եմ, որ դու էլ իմանաս դրա մասին։ Քեզ տեսել եմ իմ կողքին, ու չգիտեմ՝ կուզե՞ս, թե՞ չէ։
Ժասմինը Գոռին ասաց, որ նա պետք է իր եղբոր հետ խոսի, և միայն դրանից հետո կստանա Ժասմինի պատասխանը։ Գոռը խոսեց Ժասմինի եղբոր՝ Դավիթի հետ։
Ժասմինը, խոսելով եղբոր հետ, որոշեց, որ Գոռը պետք է գնա բանակ, վերադառնա, և միայն դրանից հետո իրենք կշփվեն։ Գոռի հետ խոսելիս նա ասաց, որ պետք է սպասի։ Գոռը չհամաձայնվեց և առաջարկեց գոնե ընկերական շփումը պահպանել։
Ժասմինը համաձայնվեց, քանի որ ինքն էլ չէր ուզում կորցնել այդ շփումը։ Նրանք շարունակեցին շփվել, բայց Ժասմինը հասկանում էր, որ իրենց շփումն այլևս ընկերական չէ։ Նա Գոռին ասաց, որ իրեն գրի միայն այն ժամանակ, երբ ինչ-որ բանի կարիք ունենա։
Գոռը նեղվեց։ Դա բնական էր, երբ ամեն հնարավոր բան անում ես, որպեսզի լինես սիրելիիդ կողքին, իսկ նա քեզ հեռու է վանում, դա ցավոտ է։
Գոռ — Լավ, չեմ կարծում՝ կարիք լինի։
Երկու օր անց Ժասմինը որոշեց գրել Գոռին։ Իրականում ինքն էլ էր նեղվում, որ նեղացրել էր նրան։ Գոռը պատասխանեց։ Խոսակցությունն այնպես ընթացավ, որ Ժասմինն այլևս չկարողացավ թաքցնել իր զգացմունքները։ Եվ վերջապես խոստովանեց։
Գոռն առաջարկեց շարունակել շփումը։ Ժասմինը համաձայն էր, բայց ցանկացավ, որ Դավիթն էլ տեղյակ լինի։ Ժասմինը ասաց, որ մի որոշ ժամանակ գաղտնի կշփվեն, իսկ հետո Դավիթին կպատմի։
Բայց նույն օրը երեկոյան, երբ Ժասմինը դուրս եկավ սենյակից, Դավիթը շատ կտրուկ ասաց.
Դավիթ — Ու՞ր է հեռախոսդ։
Ժասմին — Սենյակում է։
Դավիթը գնաց, վերցրեց հեռախոսը և նայեց նամակներին։ Տեսնելով Գոռի էջը՝ ասաց.
Դավիթ — Ժասմի՛ն, էս ի՞նչ ա։
Ժասմին — Տո՛ւր հեռախոսը, ես կպատմեմ։
Ժասմինը պատմեց ամեն ինչ, իսկ Դավոն արգելեց նրան շփվել Գոռի հետ։ Ժասմինը չէր կարող այդքան հեշտ հանձնվել և դիմեց իր հորեղբոր տղային՝ Էրոյին։
Էրոն լսեց ամեն ինչ և թույլ տվեց շարունակել շփումը։ Նա խոսեց Դավիթի հետ, և վերջինս նույնպես համաձայնվեց։
Այսպես նրանք շարունակեցին իրենց շփումը։`},
{t:"ՎԵՐՋԱԲԱՆ",s:`Իսկ ես ձեզ ուզում եմ ասել՝ ցանկացած պարագայում լսե՛ք ինքներդ ձեզ և ձեր սրտին։ Բոլորը միշտ ապրելու են իրենց կյանքով, և մի օր դադարելու են խոսել ձեր կյանքի մասին, նույնիսկ մոռանալու են ձեզ։ Իսկ դուք, նրանց լսելով, կորցնում եք ձեր ինքնուրույնությունը։
Գնացե՛ք ձեր ճանապարհով՝ այն ուղով, որով ձեզ կտանի Աստված։ Միշտ հավատացե՛ք ձեր ուժերին և հասե՛ք ձեր սրտի ուզածին։ Տղա եք, թե աղջիկ՝ միշտ էլ ելք կա, երբ լսում եք ձեր սրտին։
Մենք բոլորս այս կյանքում մի առաքելություն ունենք։ Թույլ մի՛ տվեք, որ ուրիշները որոշեն, թե որն է ձեր առաքելությունը։`}
];

const app=document.getElementById('app'),root=document.documentElement;
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function fmt(l){l=l.trim();if(!l)return'';
if(/^(Նոյեմբերի|Մայիսի) \d+$/.test(l)||l==='ԱՄԱՆՈՐԻՑ ՀԵՏՈ')return`<h3>${esc(l)}</h3>`;
if(l.length<=40&&/^(Մի քանի|Երկուշաբթի՝)/.test(l)&&!/ — |,/.test(l))return`<p class="t">${esc(l)}</p>`;
const m=l.match(/^([^—]{1,22}) — (.*)$/);
if(m)return`<p class="d"><b>${esc(m[1])}</b> — ${esc(m[2])}</p>`;
if(l.startsWith('— '))return`<p class="d">${esc(l)}</p>`;
return`<p>${esc(l)}</p>`}
function route(){
app.className='';const h=location.hash.replace('#','');const m=h.match(/^ch-(\d+)$/);let html='',title='Մեր սիրո արևածագը';
if(m&&book[+m[1]-1]){openCh(+m[1]-1);return;const i=0,c=book[0];
html=`<article><h1 class="ch">${esc(c.t)}</h1>${c.s.split('\n').map(fmt).join('')}</article><div class="pn">${i>0?`<a class="btn" href="#ch-${i}">← Նախորդ</a>`:'<span></span>'}${i<book.length-1?`<a class="btn pri" href="#ch-${i+2}">Հաջորդ →</a>`:'<a class="btn" href="#toc">Բովանդակություն</a>'}</div>${i===book.length-1?'<p class="end">Վերջ</p>':''}`}
else if(h==='toc'){html=`<h2>Բովանդակություն</h2><ul class="toc">${book.map((c,i)=>`<li><a href="#ch-${i+1}">${esc(c.t)}</a></li>`).join('')}</ul>`}
else{const l=get('last');html=COVER+`<div class="acts"><a class="btn pri" href="#ch-1">Սկսել ընթերցել</a>${l&&l>1?`<a class="btn" href="#ch-${l}">Շարունակել</a>`:''}<a class="btn" href="#toc">Բովանդակություն</a></div>`}
app.innerHTML=html;document.title=title;window.scrollTo(0,0)}
addEventListener('hashchange',route);
let fs=parseFloat(get('fs4'))||1.1;const sz=()=>{root.style.setProperty('--fs',fs+'rem');set('fs4',fs);relay()};
document.getElementById('up').onclick=()=>{fs=Math.min(1.6,fs+.1);sz()};
document.getElementById('dn').onclick=()=>{fs=Math.max(.8,fs-.1);sz()};
const tm=get('theme');if(tm)root.dataset.theme=tm;

let ci=0,pi=0,np=1,W=0,tx=0,cs=[0],pt=0,fin=null;
function layout(){const pg=document.getElementById('pg'),col=document.getElementById('col');if(!pg||!col)return;W=pg.clientWidth;const av=pg.clientHeight;let fpx=fs*16,H=30*fpx*1.4;if(H>av){fpx=av/42;H=av}col.style.cssText=`width:${W}px;height:${Math.floor(H)}px;column-width:${W}px;column-gap:0;font-size:${fpx}px`;np=Math.max(1,Math.round(col.scrollWidth/W));cs=[...col.querySelectorAll('h1.ch')].map(h=>Math.max(0,Math.floor((h.offsetLeft+2)/W)))}
function curCh(){let c=0;cs.forEach((p,i)=>{if(p<=pi)c=i});return c}
function txt(){ci=curCh();set('last',ci+1);const pc=document.getElementById('pc');if(pc)pc.textContent=`${book[ci].t} · ${pi+1} / ${np}`}
function show(d){const col=document.getElementById('col'),pg=document.getElementById('pg');if(!col)return;
const apply=()=>{col.style.transform=`translateX(${-pi*W}px)`;txt()};
if(pt){clearTimeout(pt);pt=0;if(fin)fin();fin=null}
pg.querySelectorAll('.leaf').forEach(l=>l.remove());
if(!d||matchMedia('(prefers-reduced-motion: reduce)').matches){apply();return}
const lf=document.createElement('div');lf.className='leaf '+(d>0?'n':'p');
const cl=col.cloneNode(true);cl.removeAttribute('id');if(d<0)cl.style.transform=`translateX(${-pi*W}px)`;
lf.appendChild(cl);pg.appendChild(lf);txt();if(d>0)apply();
fin=()=>{if(d<0)apply();lf.remove()};
pt=setTimeout(()=>{pt=0;const f=fin;fin=null;if(f)f()},670)}
function turn(d){if(!document.getElementById('col'))return;const n=pi+d;if(n>=0&&n<np){pi=n;show(d)}}
function relay(){if(!document.getElementById('col'))return;const r=np>1?pi/(np-1):0;layout();pi=Math.min(np-1,Math.round(r*(np-1)));show(0)}
function openCh(i){document.title=book[i].t+' — Մեր սիրո արևածագը';app.className='reader';
app.innerHTML=`<div class="pg" id="pg"><div class="sheet" id="sh"><div class="col" id="col"><article>${book.map(c=>`<h1 class="ch">${esc(c.t)}</h1>${c.s.split('\n').map(fmt).join('')}`).join('')}</article></div></div></div><div class="bar"><button id="pv" aria-label="Նախորդ էջ">←</button><span id="pc"></span><button id="nx" aria-label="Հաջորդ էջ">→</button></div>`;
const pg=document.getElementById('pg');layout();pi=Math.min(np-1,cs[i]||0);show(0);
document.getElementById('pv').onclick=()=>turn(-1);document.getElementById('nx').onclick=()=>turn(1);
pg.onclick=e=>{const r=pg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(x>.6)turn(1);else if(x<.4)turn(-1)};
pg.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
pg.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(dx<-50)turn(1);else if(dx>50)turn(-1)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{const c=curCh();layout();pi=Math.min(np-1,cs[c]||0);show(0)});window.scrollTo(0,0)}
addEventListener('resize',relay);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);else if(e.key==='ArrowLeft')turn(-1)});
sz();route();
</script>
